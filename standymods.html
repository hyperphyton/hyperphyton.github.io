<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standy Mods - hyperphyton VR</title>
  <style>
    :root {
      --bg-color: #050507;
      --card-bg: rgba(18, 18, 24, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-border-hover: rgba(255, 255, 255, 0.4);
      --text-main: #f0f0f5;
      --text-muted: #8e8e9f;
      --pure-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding: 40px 20px;
    }

    .ambient-glow {
      position: fixed;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.015) 45%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: var(--card-border-hover);
      transform: translateX(-2px);
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--pure-white);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 255, 255, 0.2);
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      user-select: none;
      color: inherit;
    }

    .action-card:hover {
      border-color: var(--card-border-hover);
      background: rgba(28, 28, 36, 0.9);
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(255, 255, 255, 0.08);
    }

    .action-card:active {
      transform: translateY(0);
    }

    .card-info {
      display: flex;
      flex-direction: column;
      text-align: left;
      gap: 3px;
    }

    .card-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--pure-white);
      letter-spacing: 0.3px;
    }

    .card-subtitle {
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .card-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b0b0c0;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .action-card:hover .card-icon {
      background: rgba(255, 255, 255, 0.15);
      color: var(--pure-white);
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <main class="container">
    <div class="header-bar">
      <a class="back-btn" href="index.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Back
      </a>
      <h1 class="page-title">Standy Mods</h1>
      <div style="width: 65px;"></div>
    </div>

    <div class="links-list">
      <!-- Moonlit -->
      <a class="action-card" href="Moonlit.apk" download="Moonlit.apk">
        <div class="card-info">
          <span class="card-title">Moonlit</span>
          <span class="card-subtitle">Long Arms update!</span>
        </div>
        <div class="card-icon">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </div>
      </a>

      <!-- 67 ADB -->
      <a class="action-card" href="67ADB.apk" download="67ADB.apk">
        <div class="card-info">
          <span class="card-title">67 ADB</span>
          <span class="card-subtitle">67 ADB mod!</span>
        </div>
        <div class="card-icon">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </div>
      </a>

      <!-- Delta -->
      <a class="action-card" href="Delta.apk" download="Delta.apk">
        <div class="card-info">
          <span class="card-title">Delta</span>
          <span class="card-subtitle">Best ADB Mod!</span>
        </div>
        <div class="card-icon">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </div>
      </a>
    </div>
  </main>

</body>
</html>
