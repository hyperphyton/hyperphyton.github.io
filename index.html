<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hyperphyton VR</title>
  
  <!-- Inter & Plus Jakarta Sans typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #050507;
      min-height: 100vh;
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient soft white spotlight at the top center */
    .ambient-glow {
      position: fixed;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 650px;
      height: 520px;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 50%, transparent 74%);
      filter: blur(55px);
      pointer-events: none;
      z-index: 0;
    }

    /* Edge shadow vignette */
    .bg-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, transparent 35%, #020204 94%);
      pointer-events: none;
      z-index: 1;
    }

    /* Circular avatar neon white halo */
    .avatar-glow {
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.45), 0 0 50px rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.9);
    }

    /* Clean text glow */
    .title-glow {
      text-shadow: 0 0 22px rgba(255, 255, 255, 0.42), 0 0 45px rgba(255, 255, 255, 0.16);
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }

    /* Monochrome buttons styled exactly like stripes.lol */
    .bw-button {
      background: #09090d;
      border: 1.5px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 4px 22px rgba(0, 0, 0, 0.8);
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bw-button:hover {
      background: #14141c;
      border-color: #ffffff;
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.24), 0 8px 26px rgba(0, 0, 0, 0.95);
      transform: translateY(-2px);
    }

    .bw-button:active {
      transform: translateY(0px) scale(0.99);
      background: #0f0f14;
    }

    /* Music equalizer bar pulse */
    @keyframes eqBounce {
      0%, 100% { height: 4px; }
      50% { height: 18px; }
    }
    .eq-bar-1 { animation: eqBounce 0.9s ease-in-out infinite; }
    .eq-bar-2 { animation: eqBounce 0.7s ease-in-out 0.2s infinite; }
    .eq-bar-3 { animation: eqBounce 1.1s ease-in-out 0.4s infinite; }

    /* Toast notification keyframes */
    @keyframes toastSlide {
      0% { opacity: 0; transform: translate(-50%, 20px); }
      12% { opacity: 1; transform: translate(-50%, 0); }
      88% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -10px); }
    }

    .toast-anim {
      animation: toastSlide 2.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
  </style>
</head>
<body class="flex flex-col items-center min-h-screen text-white select-none">

  <div class="ambient-glow"></div>
  <div class="bg-vignette"></div>

  <main class="relative z-10 w-full max-w-xl mx-auto px-5 pt-16 pb-24 flex flex-col items-center">

    <!-- Circular Avatar with real <img> tag -->
    <div class="relative group cursor-pointer mb-6">
      <div class="w-28 h-28 rounded-full avatar-glow overflow-hidden bg-black flex items-center justify-center relative">
        
        <!-- Real Image element: looks for avatar.jpg (or avatar.png) in your GitHub repo -->
        <img 
          id="avatar-img"
          src="avatar.jpg" 
          alt="hyperphyton VR Avatar" 
          class="w-full h-full object-cover object-center rounded-full transition-transform duration-300 group-hover:scale-105 block"
          onerror="handleAvatarError(this)"
        />

        <!-- Fallback if avatar file is not yet placed in directory -->
        <div id="avatar-fallback" class="hidden absolute inset-0 bg-black flex flex-col items-center justify-center text-center p-2">
          <svg class="w-8 h-8 text-white/50 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          <span class="text-[10px] text-zinc-400">avatar.jpg</span>
        </div>
      </div>

      <!-- Quick test overlay on hover to preview your local image right away -->
      <label for="avatar-file-input" class="absolute inset-0 rounded-full bg-black/70 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-200 cursor-pointer text-[11px] font-medium text-white tracking-tight text-center px-2">
        Click to test image
      </label>
      <input 
        type="file" 
        id="avatar-file-input" 
        accept="image/*" 
        class="hidden" 
        onchange="previewCustomAvatar(event)"
      />
    </div>

    <!-- Profile Title -->
    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wide text-white mb-9 title-glow text-center">
      hyperphyton VR
    </h1>

    <!-- Buttons Section -->
    <div id="buttons-container" class="w-full space-y-4 flex flex-col items-center">
      
      <!-- Button 1: Music -->
      <button 
        id="btn-music"
        type="button" 
        onclick="toggleMusicPlayer()"
        class="bw-button w-full px-5 py-4 rounded-xl flex items-center justify-between text-left cursor-pointer group"
      >
        <div class="flex flex-col pr-3">
          <div class="flex items-center space-x-2">
            <span class="text-base font-semibold text-white tracking-normal group-hover:text-white transition">
              Music
            </span>
            <!-- Live equalizer soundbars (animates when playing) -->
            <div id="audio-eq-bars" class="hidden items-end space-x-0.5 h-4 mb-0.5">
              <span class="w-1 bg-white rounded-full eq-bar-1"></span>
              <span class="w-1 bg-white rounded-full eq-bar-2"></span>
              <span class="w-1 bg-white rounded-full eq-bar-3"></span>
            </div>
          </div>
          <span class="text-xs text-zinc-400 mt-0.5 group-hover:text-zinc-300 transition">
            Music for hyperphyton VR
          </span>
        </div>

        <!-- Music Note Icon with hover invert -->
        <div class="w-8 h-8 flex-shrink-0 rounded-lg bg-white/5 border border-white/20 flex items-center justify-center group-hover:bg-white group-hover:border-white transition-all duration-200">
          <svg class="w-4 h-4 text-white group-hover:text-black transition-colors" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
          </svg>
        </div>
      </button>

      <!-- Button 2: Test -->
      <button 
        id="btn-test"
        type="button" 
        onclick="triggerToast('Test action triggered.')"
        class="bw-button w-full px-5 py-4 rounded-xl flex items-center justify-between text-left cursor-pointer group"
      >
        <div class="flex flex-col pr-3">
          <span class="text-base font-semibold text-white tracking-normal group-hover:text-white transition">
            Test
          </span>
          <span class="text-xs text-zinc-400 mt-0.5 group-hover:text-zinc-300 transition">
            Test action button
          </span>
        </div>

        <!-- Arrow icon with hover invert -->
        <div class="w-8 h-8 flex-shrink-0 rounded-lg bg-white/5 border border-white/20 flex items-center justify-center group-hover:bg-white group-hover:border-white transition-all duration-200">
          <svg class="w-4 h-4 text-white group-hover:text-black transition-colors" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
          </svg>
        </div>
      </button>

    </div>

    <!-- Collapsible Music Player Drawer -->
    <div id="music-drawer" class="hidden w-full mt-4 p-5 rounded-xl bg-[#09090d] border border-white/30 shadow-[0_8px_30px_rgba(0,0,0,0.85)] flex flex-col space-y-4">
      <div class="flex items-center justify-between border-b border-white/10 pb-3">
        <div class="flex items-center space-x-2.5">
          <span class="w-2.5 h-2.5 rounded-full bg-white shadow-[0_0_8px_#ffffff]"></span>
          <span id="player-title" class="text-sm font-semibold text-white tracking-wide">hyperphyton VR - Track 01</span>
        </div>
        <button onclick="toggleMusicPlayer()" class="text-xs text-zinc-400 hover:text-white transition">
          Close ✕
        </button>
      </div>

      <!-- Playback Controls -->
      <div class="flex items-center justify-between px-2">
        <div class="flex items-center space-x-3">
          <button id="audio-play-btn" onclick="togglePlayState()" class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center font-bold hover:scale-105 transition shadow-[0_0_15px_rgba(255,255,255,0.4)]">
            <svg id="play-icon" class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pause-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <div class="text-xs text-zinc-300 flex flex-col">
            <span id="track-status">Ready to play</span>
            <span class="text-[11px] text-zinc-500">Audio ready</span>
          </div>
        </div>

        <!-- Mute/Unmute Toggle -->
        <button onclick="toggleMute()" id="mute-btn" class="p-2 rounded-lg bg-white/5 border border-white/10 text-zinc-300 hover:text-white transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
          </svg>
        </button>
      </div>

      <!-- Real Audio Element for music.mp3 -->
      <audio id="audio-element" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
      </audio>
    </div>

  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 pointer-events-none"></div>

  <script>
    let isPlaying = false;
    let synthAudioCtx = null;
    let synthOscillator = null;
    let synthGain = null;

    /**
     * Fallback if avatar.jpg doesn't exist yet: tries avatar.png, else shows placeholder
     */
    function handleAvatarError(img) {
      if (img.src.endsWith('avatar.jpg')) {
        img.src = 'avatar.png';
      } else {
        img.classList.add('hidden');
        document.getElementById('avatar-fallback').classList.remove('hidden');
      }
    }

    /**
     * Lets user select and preview their exact picture right in the browser
     */
    function previewCustomAvatar(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById('avatar-img');
          img.src = e.target.result;
          img.classList.remove('hidden');
          document.getElementById('avatar-fallback').classList.add('hidden');
          triggerToast('Avatar preview updated!');
        };
        reader.readAsDataURL(file);
      }
    }

    /**
     * Show clean toast popup
     */
    function triggerToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast-anim px-5 py-3 rounded-xl bg-[#111116] border border-white/40 text-white text-sm font-medium shadow-[0_10px_35px_rgba(0,0,0,0.85)] backdrop-blur-md flex items-center space-x-2.5';
      toast.innerHTML = `
        <span class="w-2 h-2 rounded-full bg-white shadow-[0_0_8px_#ffffff] animate-pulse"></span>
        <span>${message}</span>
      `;

      container.innerHTML = '';
      container.appendChild(toast);

      setTimeout(() => {
        if (toast.parentNode) {
          toast.parentNode.removeChild(toast);
        }
      }, 2600);
    }

    /**
     * Toggles collapsible music player drawer
     */
    function toggleMusicPlayer() {
      const drawer = document.getElementById('music-drawer');
      const isHidden = drawer.classList.contains('hidden');
      if (isHidden) {
        drawer.classList.remove('hidden');
        triggerToast('Music player opened');
      } else {
        drawer.classList.add('hidden');
      }
    }

    /**
     * Fallback Ambient Synth drone if music.mp3 is not yet in repository
     */
    function startSynthDrone() {
      try {
        if (!synthAudioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          synthAudioCtx = new AudioContext();
        }
        if (synthAudioCtx.state === 'suspended') {
          synthAudioCtx.resume();
        }

        synthOscillator = synthAudioCtx.createOscillator();
        synthGain = synthAudioCtx.createGain();

        synthOscillator.type = 'sine';
        synthOscillator.frequency.setValueAtTime(110, synthAudioCtx.currentTime);
        synthGain.gain.setValueAtTime(0.08, synthAudioCtx.currentTime);

        synthOscillator.connect(synthGain);
        synthGain.connect(synthAudioCtx.destination);
        synthOscillator.start();
      } catch (e) {}
    }

    function stopSynthDrone() {
      if (synthOscillator) {
        try {
          synthOscillator.stop();
          synthOscillator.disconnect();
        } catch (e) {}
        synthOscillator = null;
      }
    }

    /**
     * Audio Play / Pause handler
     */
    function togglePlayState() {
      const audio = document.getElementById('audio-element');
      const playIcon = document.getElementById('play-icon');
      const pauseIcon = document.getElementById('pause-icon');
      const eqBars = document.getElementById('audio-eq-bars');
      const status = document.getElementById('track-status');

      if (!isPlaying) {
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            status.textContent = 'Playing music.mp3';
          }).catch(() => {
            startSynthDrone();
            status.textContent = 'Ambient sound playing';
          });
        }

        isPlaying = true;
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
        eqBars.classList.remove('hidden');
        eqBars.classList.add('flex');
        triggerToast('Music playing');
      } else {
        audio.pause();
        stopSynthDrone();
        isPlaying = false;
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        eqBars.classList.add('hidden');
        eqBars.classList.remove('flex');
        status.textContent = 'Playback paused';
        triggerToast('Music paused');
      }
    }

    /**
     * Audio Mute Toggle
     */
    function toggleMute() {
      const audio = document.getElementById('audio-element');
      audio.muted = !audio.muted;
      if (synthGain) {
        synthGain.gain.value = audio.muted ? 0 : 0.08;
      }
      triggerToast(audio.muted ? 'Audio muted' : 'Audio unmuted');
    }
  </script>

</body>
</html>
