<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hyperphyton VR</title>
  
  <!-- Inter typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #050507;
      --card-bg: rgba(18, 18, 24, 0.78);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-border-hover: rgba(255, 255, 255, 0.45);
      --text-main: #f0f0f5;
      --text-muted: #8e8e9f;
      --pure-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding: 40px 20px;
    }

    /* Ambient lighting */
    .ambient-glow {
      position: fixed;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.015) 45%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Circular Avatar */
    .avatar-wrapper {
      position: relative;
      width: 104px;
      height: 104px;
      margin-bottom: 20px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .avatar-glow {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.1) 60%, transparent 80%);
      filter: blur(10px);
      opacity: 0.8;
    }

    .avatar-circle {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.85);
      background: #000;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.25), inset 0 0 15px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--pure-white);
      margin-bottom: 30px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 255, 255, 0.2);
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      user-select: none;
    }

    .action-card:hover {
      border-color: var(--card-border-hover);
      background: rgba(28, 28, 36, 0.9);
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(255, 255, 255, 0.08);
    }

    .action-card:active {
      transform: translateY(0);
    }

    .card-info {
      display: flex;
      flex-direction: column;
      text-align: left;
      gap: 3px;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--pure-white);
      letter-spacing: 0.3px;
    }

    .card-subtitle {
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .card-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b0b0c0;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .action-card:hover .card-icon {
      background: rgba(255, 255, 255, 0.15);
      color: var(--pure-white);
    }

    /* Equalizer animation for button */
    .equalizer-bars {
      display: none;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }

    .equalizer-bars.active {
      display: inline-flex;
    }

    .equalizer-bars span {
      width: 2px;
      background-color: var(--pure-white);
      border-radius: 1px;
      animation: soundWave 0.9s ease-in-out infinite alternate;
    }

    .equalizer-bars span:nth-child(1) { height: 4px; animation-delay: 0.1s; }
    .equalizer-bars span:nth-child(2) { height: 12px; animation-delay: 0.3s; }
    .equalizer-bars span:nth-child(3) { height: 7px; animation-delay: 0.2s; }

    @keyframes soundWave {
      0% { height: 3px; }
      100% { height: 12px; }
    }

    /* Draggable Mini Music Player Modal */
    .draggable-player {
      position: fixed;
      width: 320px;
      background: rgba(14, 14, 20, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 255, 255, 0.05);
      z-index: 999;
      display: none;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .draggable-player.visible {
      display: flex;
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      cursor: grab;
    }

    .player-header:active {
      cursor: grabbing;
    }

    .player-header-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--pure-white);
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .drag-indicator {
      display: flex;
      flex-direction: column;
      gap: 2px;
      opacity: 0.4;
    }

    .drag-indicator span {
      width: 14px;
      height: 1.5px;
      background: #fff;
      border-radius: 1px;
    }

    .player-close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      transition: all 0.15s ease;
    }

    .player-close-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .player-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .track-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .track-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--pure-white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Progress bar */
    .progress-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-bar-bg {
      position: relative;
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      cursor: pointer;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--pure-white);
      border-radius: 3px;
      position: relative;
      transition: width 0.08s linear;
    }

    .progress-times {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Player controls */
    .player-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #a5a5b5;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 6px;
      transition: all 0.15s ease;
    }

    .ctrl-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .ctrl-btn.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .play-pause-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ffffff;
      color: #000000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .play-pause-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 0 22px rgba(255, 255, 255, 0.5);
    }

    .play-pause-btn:active {
      transform: scale(0.96);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: rgba(18, 18, 22, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--pure-white);
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 12.5px;
      opacity: 0;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 6px #ffffff;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <!-- Audio Element -->
  <audio id="audio-player" preload="metadata"></audio>

  <!-- Main Profile Container -->
  <main class="container">
    <div class="avatar-wrapper">
      <div class="avatar-glow"></div>
      <div class="avatar-circle">
        <img id="avatar-img" src="avatar.jpg" alt="hyperphyton avatar">
      </div>
    </div>

    <h1 class="profile-title">hyperphyton VR</h1>

    <div class="links-list">
      <!-- Music Button (Toggles Draggable Mini Player) -->
      <button class="action-card" id="music-btn" type="button">
        <div class="card-info">
          <div class="card-title-row">
            <span class="card-title">Music</span>
            <div class="equalizer-bars" id="eq-bars">
              <span></span><span></span><span></span>
            </div>
          </div>
          <span class="card-subtitle" id="music-sub">Audio player & playlist</span>
        </div>
        <div class="card-icon" id="music-icon-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
        </div>
      </button>

      <!-- Test Button -->
      <button class="action-card" id="test-btn" type="button">
        <div class="card-info">
          <span class="card-title">Test</span>
          <span class="card-subtitle">Test action button</span>
        </div>
        <div class="card-icon">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </button>
    </div>
  </main>

  <!-- Floating Draggable Mini Player -->
  <div class="draggable-player" id="mini-player">
    <!-- Header / Drag Handle -->
    <div class="player-header" id="player-header">
      <div class="player-header-title">
        <div class="drag-indicator">
          <span></span><span></span><span></span>
        </div>
        <span>Now Playing</span>
      </div>
      <button class="player-close-btn" id="close-player-btn" title="Close player">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Body / Controls -->
    <div class="player-body">
      <div class="track-meta">
        <div class="track-name" id="track-name">SACRED WAR FUNK</div>
        <div class="track-artist" id="track-artist">hyperphyton VR • Track 1 of 1</div>
      </div>

      <!-- Scrubbable Progress Bar -->
      <div class="progress-container">
        <div class="progress-bar-bg" id="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
        <div class="progress-times">
          <span id="time-current">0:00</span>
          <span id="time-duration">0:00</span>
        </div>
      </div>

      <!-- Control Buttons -->
      <div class="player-controls">
        <!-- Loop Button -->
        <button class="ctrl-btn" id="loop-btn" title="Loop Mode">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
        </button>

        <!-- Previous Track Button -->
        <button class="ctrl-btn" id="prev-btn" title="Previous Track">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
          </svg>
        </button>

        <!-- Play / Pause Button -->
        <button class="play-pause-btn" id="play-pause-btn" title="Play / Pause">
          <svg id="dlg-play-svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px;">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="dlg-pause-svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>

        <!-- Next Track Button -->
        <button class="ctrl-btn" id="next-btn" title="Next Track">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>

        <!-- Mute / Volume Button -->
        <button class="ctrl-btn" id="mute-btn" title="Mute / Unmute">
          <svg id="vol-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="mute-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <div class="toast-dot"></div>
    <span id="toast-text">Notification</span>
  </div>

  <script>
    // Playlist definition (add more songs here easily in the future)
    const playlist = [
      {
        title: 'SACRED WAR FUNK',
        artist: 'hyperphyton VR',
        src: 'sacred-war-funk.mp3'
      }
    ];

    let currentTrackIndex = 0;
    let isLooping = false;

    // Elements
    const audio = document.getElementById('audio-player');
    const miniPlayer = document.getElementById('mini-player');
    const playerHeader = document.getElementById('player-header');
    const musicBtn = document.getElementById('music-btn');
    const closePlayerBtn = document.getElementById('close-player-btn');
    const eqBars = document.getElementById('eq-bars');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const dlgPlaySvg = document.getElementById('dlg-play-svg');
    const dlgPauseSvg = document.getElementById('dlg-pause-svg');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const loopBtn = document.getElementById('loop-btn');
    const muteBtn = document.getElementById('mute-btn');
    const volSvg = document.getElementById('vol-svg');
    const muteSvg = document.getElementById('mute-svg');
    const trackNameEl = document.getElementById('track-name');
    const trackArtistEl = document.getElementById('track-artist');
    const progressBarBg = document.getElementById('progress-bar-bg');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const timeCurrent = document.getElementById('time-current');
    const timeDuration = document.getElementById('time-duration');
    const testBtn = document.getElementById('test-btn');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');

    let toastTimeout;
    function showToast(msg) {
      clearTimeout(toastTimeout);
      toastText.textContent = msg;
      toast.classList.add('visible');
      toastTimeout = setTimeout(() => {
        toast.classList.remove('visible');
      }, 2400);
    }

    // Format mm:ss
    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Load track
    function loadTrack(index) {
      const track = playlist[index];
      trackNameEl.textContent = track.title;
      trackArtistEl.textContent = `${track.artist} • Track ${index + 1} of ${playlist.length}`;
      audio.src = track.src;
      audio.loop = isLooping;
      progressBarFill.style.width = '0%';
      timeCurrent.textContent = '0:00';
    }

    // Toggle Play/Pause
    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => {
          updatePlayUI(true);
          showToast(`Playing: ${playlist[currentTrackIndex].title}`);
        }).catch(err => {
          console.warn('Audio playback error:', err);
          showToast('File not found in repo');
          updatePlayUI(false);
        });
      } else {
        audio.pause();
        updatePlayUI(false);
        showToast('Playback paused');
      }
    }

    function updatePlayUI(playing) {
      if (playing) {
        dlgPlaySvg.style.display = 'none';
        dlgPauseSvg.style.display = 'block';
        eqBars.classList.add('active');
      } else {
        dlgPlaySvg.style.display = 'block';
        dlgPauseSvg.style.display = 'none';
        eqBars.classList.remove('active');
      }
    }

    // Next Track
    function nextTrack() {
      currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
      loadTrack(currentTrackIndex);
      audio.play().then(() => {
        updatePlayUI(true);
        showToast(`Next: ${playlist[currentTrackIndex].title}`);
      }).catch(() => {
        updatePlayUI(false);
      });
    }

    // Prev Track
    function prevTrack() {
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
      } else {
        currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
        loadTrack(currentTrackIndex);
      }
      audio.play().then(() => {
        updatePlayUI(true);
        showToast(`Playing: ${playlist[currentTrackIndex].title}`);
      }).catch(() => {
        updatePlayUI(false);
      });
    }

    // Toggle Loop Mode
    function toggleLoop() {
      isLooping = !isLooping;
      audio.loop = isLooping;
      if (isLooping) {
        loopBtn.classList.add('active');
        showToast('Loop mode: ON');
      } else {
        loopBtn.classList.remove('active');
        showToast('Loop mode: OFF');
      }
    }

    // Toggle Mute
    function toggleMute() {
      audio.muted = !audio.muted;
      if (audio.muted) {
        volSvg.style.display = 'none';
        muteSvg.style.display = 'block';
        showToast('Muted');
      } else {
        volSvg.style.display = 'block';
        muteSvg.style.display = 'none';
        showToast('Unmuted');
      }
    }

    // Audio Event Listeners
    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressBarFill.style.width = `${percent}%`;
        timeCurrent.textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      timeDuration.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      if (!isLooping) {
        nextTrack();
      }
    });

    // Scrubbable Progress Bar Click
    progressBarBg.addEventListener('click', (e) => {
      const rect = progressBarBg.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const width = rect.width;
      if (audio.duration) {
        audio.currentTime = (clickX / width) * audio.duration;
      }
    });

    // Show / Position Mini Player
    function openPlayer() {
      miniPlayer.classList.add('visible');
      if (!miniPlayer.style.top || !miniPlayer.style.left) {
        // Initial center-bottom placement
        const initialLeft = Math.max(16, (window.innerWidth - 320) / 2);
        const initialTop = Math.max(40, window.innerHeight - 230);
        miniPlayer.style.left = `${initialLeft}px`;
        miniPlayer.style.top = `${initialTop}px`;
      }
    }

    function togglePlayer() {
      if (miniPlayer.classList.contains('visible')) {
        miniPlayer.classList.remove('visible');
      } else {
        openPlayer();
      }
    }

    // Click on Music button opens player and starts playback if paused
    musicBtn.addEventListener('click', () => {
      openPlayer();
      if (audio.paused) {
        togglePlay();
      }
    });

    closePlayerBtn.addEventListener('click', () => {
      miniPlayer.classList.remove('visible');
    });

    playPauseBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextTrack);
    prevBtn.addEventListener('click', prevTrack);
    loopBtn.addEventListener('click', toggleLoop);
    muteBtn.addEventListener('click', toggleMute);
    testBtn.addEventListener('click', () => showToast('Test action triggered'));

    // Smooth Draggable Implementation (Desktop & Touch)
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let initialPlayerX = 0;
    let initialPlayerY = 0;

    function onDragStart(clientX, clientY) {
      isDragging = true;
      const rect = miniPlayer.getBoundingClientRect();
      initialPlayerX = rect.left;
      initialPlayerY = rect.top;
      dragStartX = clientX;
      dragStartY = clientY;
    }

    function onDragMove(clientX, clientY) {
      if (!isDragging) return;
      const deltaX = clientX - dragStartX;
      const deltaY = clientY - dragStartY;
      
      let newX = initialPlayerX + deltaX;
      let newY = initialPlayerY + deltaY;

      // Keep within window viewport boundaries
      const maxX = window.innerWidth - miniPlayer.offsetWidth - 8;
      const maxY = window.innerHeight - miniPlayer.offsetHeight - 8;
      newX = Math.min(Math.max(8, newX), Math.max(8, maxX));
      newY = Math.min(Math.max(8, newY), Math.max(8, maxY));

      miniPlayer.style.left = `${newX}px`;
      miniPlayer.style.top = `${newY}px`;
    }

    function onDragEnd() {
      isDragging = false;
    }

    // Mouse drag events
    playerHeader.addEventListener('mousedown', (e) => {
      if (e.target.closest('#close-player-btn')) return;
      onDragStart(e.clientX, e.clientY);
      e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) onDragMove(e.clientX, e.clientY);
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) onDragEnd();
    });

    // Touch drag events (Mobile)
    playerHeader.addEventListener('touchstart', (e) => {
      if (e.target.closest('#close-player-btn')) return;
      const touch = e.touches[0];
      onDragStart(touch.clientX, touch.clientY);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (isDragging) {
        const touch = e.touches[0];
        onDragMove(touch.clientX, touch.clientY);
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', () => {
      if (isDragging) onDragEnd();
    });

    // Initialize initial track
    loadTrack(currentTrackIndex);
  </script>
</body>
</html>
